<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="header yns-site-header">

    <div class="container navigation yns-public-navigation">

        <a th:href="@{/}" class="yns-logo">
            <img th:src="@{/images/logo-yns.png(v=1791073844)}"
                 src="/images/logo-yns.png?v=1791073844"
                 alt="Logo YNS Equipements">

            <span>
                <strong>YNS</strong> EQUIPEMENTS
            </span>
        </a>

        <div class="yns-header-actions">

            <details class="yns-public-menu">
                <summary>
                    <span>Menu</span>
                </summary>

                <nav class="yns-public-menu-panel">
                    <a th:href="@{/}">
                        Accueil
                    </a>

                    <a th:href="@{/catalogue}">
                        Catalogue
                    </a>

                    <a th:href="@{/recherche-produit}">
                        Je recherche un produit
                    </a>
                </nav>
            </details>

            <a th:href="@{/panier}" class="yns-selection-link">
                <span>Ma sélection</span>

                <span class="yns-selection-count"
                      th:text="${nombrePanier != null ? nombrePanier : 0}">
                    0
                </span>
            </a>

        </div>

    </div>
</header>

<footer th:fragment="footer" class="footer">
    <div class="container footer-grid">
        <div>
            <h3>YNS Equipements</h3>
            <p>Audiovisuel • Informatique • Mobilité</p>
        </div>

        <div>
            <a th:href="@{/mentions-legales}">
                Mentions légales
            </a>

            <a th:href="@{/confidentialite}">
                Confidentialité
            </a>

            <a th:href="@{/admin}">
                Administration
            </a>
        </div>
    </div>

    <p class="avertissement">
        Aucun paiement n’est réalisé sur ce site.
        Les transactions sont finalisées sur Vinted ou Leboncoin.
    </p>
</footer>

</body>
</html>
