<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title th:text="${annonce.titre}">Annonce</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=10)}">
    <link rel="icon" type="image/png"
          th:href="@{/favicon.png(v=1791073844)}"
          href="/favicon.png?v=1791073844">
    <link rel="apple-touch-icon"
          th:href="@{/favicon.png(v=1791073844)}"
          href="/favicon.png?v=1791073844">

    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="container section">
    <a th:href="@{/catalogue}" class="retour">
        ← Retour au catalogue
    </a>

    <div class="detail">
        
<section class="galerie yns-product-gallery">
    <button type="button"
            class="yns-gallery-item"
            th:each="photo : ${annonce.listePhotos()}"
            th:attr="data-image=${photo}"
            aria-label="Agrandir la photo">

        <img th:src="${photo}"
             th:alt="${annonce.titre}"
             loading="lazy">
    </button>
</section>

<div id="ynsLightbox"
     class="yns-lightbox"
     hidden
     role="dialog"
     aria-modal="true"
     aria-label="Photo agrandie">

    <button type="button"
            class="yns-lightbox-close"
            aria-label="Fermer">
        &times;
    </button>

    <button type="button"
            class="yns-lightbox-previous"
            aria-label="Photo précédente">
        &#10094;
    </button>

    <img id="ynsLightboxImage"
         src=""
         alt="Photo du produit agrandie">

    <button type="button"
            class="yns-lightbox-next"
            aria-label="Photo suivante">
        &#10095;
    </button>
</div>


        <section class="fiche">
            <span class="categorie"
                  th:text="${annonce.categorie}">
            </span>

            <h1 th:text="${annonce.titre}"></h1>

            <div class="grand-prix"
                 th:text="${annonce.prix + ' €'}">
            </div>

            <p>
                <strong>État :</strong>
                <span th:text="${annonce.etat}"></span>
            </p>

            <p>
                <strong>Disponibilité :</strong>

                <span class="statut"
                      th:classappend="${annonce.statutCss()}"
                      th:text="${annonce.statut}">
                </span>
            </p>

            <div class="description">
                <h2>Description</h2>
                <p th:text="${annonce.description}"></p>
            </div>

            <div class="actions">

                <form th:if="${annonce.statut == 'DISPONIBLE'}"
                      th:action="@{/panier/ajouter/{id}(id=${annonce.id})}"
                      method="post">

                    <button class="btn btn-outline btn-block"
                            type="submit">
                        Ajouter à ma sélection
                    </button>
                </form>

                <form th:if="${annonce.statut == 'DISPONIBLE'}"
                      th:action="@{/reservation/directe/{id}(id=${annonce.id})}"
                      method="post">

                    <button class="btn btn-primary btn-block"
                            type="submit">
                        Réserver maintenant
                    </button>
                </form>

            <a class="yns-offer-button"
               th:if="${annonce.statut == 'DISPONIBLE'}"
               th:href="@{/annonce/{id}/offre(id=${annonce.id})}">
                Faire une offre
            </a>

                <a th:if="${annonce.aSubito()}"
                   th:href="${annonce.lienSubito}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="btn btn-subito btn-block">
                    Voir sur Subito
                </a>

                <a th:if="${annonce.aLeboncoin()}"
                   th:href="${annonce.lienLeboncoin}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="btn btn-leboncoin btn-block">
                    Voir sur Leboncoin
                </a>

                <a th:if="${annonce.aVinted()}"
                   th:href="${annonce.lienVinted}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="btn btn-vinted btn-block">
                    Voir sur Vinted
                </a>
            </div>

            <div class="information">
                Aucun paiement n’est effectué sur ce site.
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>


<script>
document.addEventListener("DOMContentLoaded", function () {
    const photos = Array.from(
        document.querySelectorAll(".yns-gallery-item")
    );

    const lightbox = document.getElementById("ynsLightbox");
    const lightboxImage = document.getElementById("ynsLightboxImage");
    const closeButton = lightbox.querySelector(".yns-lightbox-close");
    const previousButton = lightbox.querySelector(".yns-lightbox-previous");
    const nextButton = lightbox.querySelector(".yns-lightbox-next");

    let currentIndex = 0;

    function showPhoto(index) {
        if (photos.length === 0) return;

        currentIndex = (index + photos.length) % photos.length;
        lightboxImage.src = photos[currentIndex].dataset.image;
    }

    function openLightbox(index) {
        showPhoto(index);
        lightbox.hidden = false;
        document.body.classList.add("yns-lightbox-open");
        closeButton.focus();
    }

    function closeLightbox() {
        lightbox.hidden = true;
        lightboxImage.src = "";
        document.body.classList.remove("yns-lightbox-open");
    }

    photos.forEach(function (photo, index) {
        photo.addEventListener("click", function () {
            openLightbox(index);
        });
    });

    closeButton.addEventListener("click", closeLightbox);

    previousButton.addEventListener("click", function () {
        showPhoto(currentIndex - 1);
    });

    nextButton.addEventListener("click", function () {
        showPhoto(currentIndex + 1);
    });

    lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox) {
            closeLightbox();
        }
    });

    document.addEventListener("keydown", function (event) {
        if (lightbox.hidden) return;

        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") showPhoto(currentIndex - 1);
        if (event.key === "ArrowRight") showPhoto(currentIndex + 1);
    });
});
</script>

</body>
</html>
